# Open the per-room ChatInfoScreen — participants, room name,
# leave-room control. Catches: GET /chats/:jid/details regression,
# avatar URL malformed, leave-room button hidden on rooms the user
# owns, participant list not re-rendering on roster change.
appId: com.ethora
---
- runFlow: 04-send-text.yaml
# Tap the room title bar / info affordance. Selectors marked
# optional so the test still composes meaningfully if the SDK
# adds an "info" icon vs. tapping the title.
- tapOn:
    id: "chat_room_info_button"
    optional: true
- tapOn:
    id: "chat_room_title"
    optional: true
- assertVisible:
    text: "Participants"
    optional: true
# At least the current user (alice) should appear in the list.
- assertVisible:
    text: ${MAESTRO_TEST_EMAIL:-alice@ethora.com}
    substring: true
    optional: true
# A "Leave room" affordance should be present (most rooms allow
# leave). If it isn't, surface as a known gap rather than a hard
# fail with optional: true.
- assertVisible:
    text: "Leave"
    substring: true
    optional: true
# Back navigation should return to the conversation, not the room
# list — assert by checking the previously-sent message is still
# the active context.
- back
- assertVisible: "maestro hello"
