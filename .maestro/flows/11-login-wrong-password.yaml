# Negative login path — wrong password produces a visible error,
# the form stays open, and no spurious "Chat ready: Yes" appears.
# Catches: error response not surfaced to UI, retry loop on 401,
# accidental login under a stale cached token.
appId: com.ethora
env:
  EMAIL: ${MAESTRO_TEST_EMAIL:-alice@ethora.com}
  WRONG_PASSWORD: "definitely-not-the-password-${EPOCH}"
---
- launchApp:
    clearState: true
- tapOn: "SETUP"
- tapOn:
    text: "Email"
- inputText: ${EMAIL}
- tapOn:
    text: "Password"
- inputText: ${WRONG_PASSWORD}
- tapOn: "Connect"
- extendedWaitUntil:
    visible: "Login failed"
    timeout: 10000
- assertNotVisible: "Chat ready: Yes"
# After the failure the form should still be editable so the user
# can correct the password without restarting the app.
- assertVisible:
    text: "Connect"
